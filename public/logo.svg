<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background subtle glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#7f1d1d" flood-opacity="0.4" />
    </filter>

    <!-- Metallic Blue Gradients -->
    <linearGradient id="blueRingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="blueRingGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="blueHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glossy Red Gradients -->
    <linearGradient id="redArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="90%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="redBevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.7" />
    </linearGradient>

    <!-- Black Gloss Gradients -->
    <linearGradient id="blackSwirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <g id="logo-emblem">
    <!-- Top-Left Blue Metallic Crescent Arc -->
    <path
      d="M 125 365 A 175 175 0 1 1 370 120"
      fill="none"
      stroke="url(#blueRingGrad1)"
      stroke-width="32"
      stroke-linecap="round"
      filter="url(#dropShadow)"
    />
    <!-- Top-Left Blue Ring Inner Highlight -->
    <path
      d="M 130 355 A 165 165 0 1 1 360 130"
      fill="none"
      stroke="url(#blueHighlight)"
      stroke-width="6"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Bottom-Right Blue Metallic Crescent Arc -->
    <path
      d="M 390 150 A 175 175 0 0 1 140 395"
      fill="none"
      stroke="url(#blueRingGrad2)"
      stroke-width="32"
      stroke-linecap="round"
      filter="url(#dropShadow)"
    />

    <!-- Inner Black Brush Swirls -->
    <path
      d="M 145 325 A 130 130 0 1 1 345 155"
      fill="none"
      stroke="url(#blackSwirlGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-dasharray="420 20"
      filter="url(#dropShadow)"
    />
    <path
      d="M 155 315 A 120 120 0 0 1 335 170"
      fill="none"
      stroke="#475569"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.6"
    />

    <!-- Inner Black Lower Arc Accent -->
    <path
      d="M 350 175 A 130 130 0 0 1 175 350"
      fill="none"
      stroke="url(#blackSwirlGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- Red Zigzag Pulse / Arrow Shaft -->
    <!-- Point 1 (Tail): (95, 395) -> Point 2 (Peak): (225, 195) -> Point 3 (Valley): (268, 298) -> Point 4 (Head base): (405, 100) -->
    <path
      d="M 95 395 L 225 195 L 268 298 L 405 100"
      fill="none"
      stroke="url(#redArrowGrad)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#arrowShadow)"
    />

    <!-- Red Arrow Top Highlight / Bevel Ridge -->
    <path
      d="M 102 385 L 225 200 L 268 295 L 398 108"
      fill="none"
      stroke="url(#redBevelLight)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Sharp Arrow Head -->
    <polygon
      points="435,55 365,85 395,135"
      fill="url(#redArrowGrad)"
      filter="url(#arrowShadow)"
    />
    <polygon
      points="435,55 385,80 395,135"
      fill="#fca5a5"
      opacity="0.4"
    />
  </g>
</svg>
